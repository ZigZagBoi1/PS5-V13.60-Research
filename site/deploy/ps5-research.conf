# Included only inside the existing marwanmohamed.ca HTTPS server block.
location = /ps5 { return 302 /ps5/; }
location = /ps5/relapse { return 302 /ps5/; }
location = /ps5/relapse/ { return 302 /ps5/; }
location ^~ /ps5/relapse/ {
    alias /var/www/ps5-research/web/relapse/;
    autoindex off;
    allow 10.0.0.0/24;
    deny all;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
location ^~ /ps5/api/hv/ {
    proxy_pass http://127.0.0.1:8875;
    proxy_http_version 1.1;
    proxy_set_header Host marwanmohamed.ca;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 15s;
    client_body_timeout 10s;
    client_max_body_size 32k;
    proxy_buffering off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /ps5/ {
    proxy_pass http://127.0.0.1:8875;
    proxy_http_version 1.1;
    proxy_set_header Host marwanmohamed.ca;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_body_timeout 10s;
    client_max_body_size 32k;
    proxy_buffering off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
